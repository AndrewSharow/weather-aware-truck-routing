services:
  - type: web
    name: weather-routing-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4
      --timeout 60 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: HERE_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPEN_METEO_URL
        sync: false
